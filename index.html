<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>P2P chat</title>
        <link rel="stylesheet" href="style.css" />
        <script type="module" src="script.js"></script>
    </head>
    <body>
        <aside>
            <h1>P2P chat</h1>
            <p>
                Simple peer-to-peer chat without a backend. All messages are
                sent directly, and are not stored anywhere.
            </p>
            <p>Enter room ID to join:</p>
            <form id="joinForm">
                <input
                    type="text"
                    id="roomId"
                    placeholder="Room ID..."
                    autocomplete="off"
                    required
                    autofocus
                />
                <button type="submit">Join</button>
            </form>
            <p>Change username:</p>
            <form id="userForm">
                <input
                    type="text"
                    id="username"
                    placeholder="New username..."
                    autocomplete="off"
                    required
                    autofocus
                />
                <button type="submit">Change</button>
            </form>
            <p id="info"></p>
        </aside>
        <main>
            <article id="chat"></article>
            <form id="messageForm">
                <input
                    type="text"
                    id="messageText"
                    placeholder="Your message..."
                    autocomplete="off"
                    required
                />
                <button type="submit">Send</button>
            </form>
        </main>
    </body>
</html>
